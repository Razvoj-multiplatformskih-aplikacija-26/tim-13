name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Keep the shared packages free of platform code
        run: "! grep -rE 'package:flutter|dart:io|dart:ffi|dart:js_interop' packages/domain/lib packages/api_contract/lib packages/use_cases/lib packages/api_mapping/lib packages/blocs/lib"

      - name: Keep the contract independent of the domain
        run: "! grep -rE 'package:(domain|use_cases|blocs)/' packages/api_contract/lib"

      - name: Test shared packages on the VM and in Chrome
        run: |
          for package in packages/domain packages/api_contract packages/use_cases packages/api_mapping packages/blocs; do
            (cd "${package}" && dart test -p vm,chrome)
          done

      - name: Test Flutter apps
        run: |
          for package in apps/mobile apps/backoffice; do
            (cd "${package}" && flutter test)
          done
